# Cloudflare Zero Trust Tunnel - ax01.com.mx
#
# Referencia de las rutas del túnel. Con el túnel por token (docker-compose.yml)
# estas rutas se configuran en el panel (Routes); este archivo no se lee.
# Los servicios usan nombres de contenedor de la red Docker "web".
# __TUNNEL_ID__: UUID del túnel, solo si se usa como túnel gestionado localmente.

tunnel: __TUNNEL_ID__
credentials-file: /etc/cloudflared/__TUNNEL_ID__.json

# Métricas locales (útil para monitoreo / healthcheck)
metrics: 127.0.0.1:20241

# Reintentos y protocolo
protocol: auto          # quic con fallback a http2
retries: 5
grace-period: 30s

originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  keepAliveTimeout: 90s
  noHappyEyeballs: false

ingress:
  # CMS (app independiente, HTTP directo al contenedor)
  - hostname: cms.ax01.com.mx
    service: http://cms:80

  # API y Admin pasan por nginx, que redirige 80 -> 443 y sirve en 443 con
  # el certificado Origin CA. Apuntar al 80 provocaría un loop de redirección.
  # originServerName: el cert es *.ax01.com.mx, no "nginx".
  - hostname: api.ax01.com.mx
    service: https://nginx:443
    originRequest:
      originServerName: api.ax01.com.mx

  # Admin (protégelo con una Access policy)
  - hostname: admin.ax01.com.mx
    service: https://nginx:443
    originRequest:
      originServerName: admin.ax01.com.mx

  # --- Ejemplos: descomenta / ajusta según tus servicios ---

  # Origen HTTPS con certificado autofirmado
  # - hostname: panel.ax01.com.mx
  #   service: https://localhost:8443
  #   originRequest:
  #     noTLSVerify: true

  # SSH vía navegador / cloudflared access (protégelo con una Access policy)
  # - hostname: ssh.ax01.com.mx
  #   service: ssh://localhost:22

  # Regla final obligatoria: todo lo demás devuelve 404
  - service: http_status:404
