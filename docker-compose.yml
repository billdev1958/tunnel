# Cloudflare Tunnel (Zero Trust) en Docker - ax01.com.mx
# Uso:
#   1. Zero Trust > Networks > Tunnels > Create tunnel > Cloudflared > Docker
#   2. Copia el token a .env  (TUNNEL_TOKEN=eyJ...)
#   3. docker compose up -d          (crea la red "web")
#   4. En el panel, Routes > Add route > Published application:
#        cms.ax01.com.mx   -> http://cms:80
#        api.ax01.com.mx   -> https://nginx:443
#            TLS > Origin Server Name: api.ax01.com.mx
#        admin.ax01.com.mx -> https://nginx:443
#            TLS > Origin Server Name: admin.ax01.com.mx
#      nginx redirige 80 -> 443, por eso api/admin van al 443 (si no, loop 301).
#
# Tus apps (en sus propios docker-compose) deben unirse a la red "web":
#
#   services:
#     cms:
#       image: ...
#       container_name: cms
#       expose: ["80"]          # sin "ports:", no se publica al host
#       networks: [web]
#     nginx:                    # proxy de api y admin, cert Origin CA
#       image: nginx
#       container_name: nginx
#       expose: ["443"]
#       networks: [web]
#   networks:
#     web:
#       external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - web

networks:
  web:
    name: web
