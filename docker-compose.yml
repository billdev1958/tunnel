# Cloudflare Tunnel (Zero Trust) en Docker - ax01.com.mx
# Uso:
#   1. Zero Trust > Networks > Tunnels > Create tunnel > Cloudflared > Docker
#   2. Copia el token a .env  (TUNNEL_TOKEN=eyJ...)
#   3. docker compose up -d          (crea la red "web")
#   4. En el panel, pestaña "Public Hostname", agrega:
#        Subdomain: cms   Domain: ax01.com.mx   Type: HTTP   URL: cms:80
#        Subdomain: api   Domain: ax01.com.mx   Type: HTTP   URL: api:80
#      (URL = nombre del contenedor : puerto interno de la app)
#
# Tus apps (en sus propios docker-compose) deben unirse a la red "web":
#
#   services:
#     cms:
#       image: ...
#       container_name: cms
#       expose: ["80"]          # sin "ports:", no se publica al host
#       networks: [web]
#     api:
#       image: ...
#       container_name: api
#       expose: ["80"]
#       networks: [web]
#   networks:
#     web:
#       external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - web

networks:
  web:
    name: web
